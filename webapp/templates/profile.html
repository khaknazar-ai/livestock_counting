{% extends "base.html" %}{% block title %}个人设置{% endblock %}
{% block content %}
<div class="page-header"><h1>个人设置</h1></div>
{% if msg %}<div class="card" style="background:#ecfdf5;border-left:4px solid #059669"><p style="color:#059669">{{ msg }}</p></div>{% endif %}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="card"><h2 class="card-title">基本信息</h2>
<form method="POST"><input type="hidden" name="action" value="update_profile">
<div class="form-group"><label>用户名</label><input type="text" value="{{ current_user.username }}" class="input-field" disabled></div>
<div class="form-group"><label>角色</label><input type="text" value="{{ current_user.role }}" class="input-field" disabled></div>
<div class="form-group"><label>显示名称</label><input type="text" name="display_name" value="{{ current_user.display_name }}" class="input-field"></div>
<div class="form-group"><label>所属单位/牧场</label><input type="text" name="organization" value="{{ current_user.organization or '' }}" class="input-field" placeholder="例：东区羊场"></div>
<button type="submit" class="btn btn-primary">保存</button></form></div>
<div class="card"><h2 class="card-title">修改密码</h2>
<form method="POST"><input type="hidden" name="action" value="change_password">
<div class="form-group"><label>当前密码</label><input type="password" name="old_password" class="input-field" required></div>
<div class="form-group"><label>新密码</label><input type="password" name="new_password" class="input-field" required></div>
<button type="submit" class="btn btn-primary">修改密码</button></form></div>
</div>{% endblock %}
